<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Симуляция ткани</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="panel">
    <div class="panel-header">
      <h1>Ткань · PBD · WebGPU</h1>
      <button id="panel-toggle" type="button" aria-label="Свернуть панель" title="Свернуть">−</button>
    </div>

    <div class="panel-body">
      <label class="row checkbox">
        <input type="checkbox" id="gravity" />
        <span>Включить гравитацию</span>
      </label>

      <label class="row">
        <span>Амплитуда волны <b id="amp-val">0.20</b></span>
        <input type="range" id="amp" min="0" max="0.5" step="0.01" value="0.20" />
      </label>

      <label class="row">
        <span>Частота, Гц <b id="freq-val">1.0</b></span>
        <input type="range" id="freq" min="0" max="3" step="0.05" value="1.0" />
      </label>

      <label class="row">
        <span>Сила тяжести <b id="grav-val">9.8</b></span>
        <input type="range" id="grav" min="0" max="30" step="0.5" value="9.8" />
      </label>

      <label class="row">
        <span>Подшагов / кадр <b id="sub-val">5</b></span>
        <input type="range" id="sub" min="1" max="25" step="1" value="5" />
      </label>

      <label class="row checkbox">
        <input type="checkbox" id="wire" checked />
        <span>Показывать сетку (wireframe)</span>
      </label>

      <div class="row buttons">
        <button id="reset" type="button">Сброс</button>
      </div>

      <p class="hint">ЛКМ — вращать · колесо — зум</p>
      <p id="stats"></p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
